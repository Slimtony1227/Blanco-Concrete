<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- This makes the site look correct on mobile phones instead of zooming out -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The little icon that shows in the browser tab -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Page metadata: descriptions and addresses for search and shared links. -->
    <title>Blanco's Concrete Paint &amp; Maintenance Service | Raleigh, NC</title>
    <meta name="description" content="Servicios de pintura, concreto y mantenimiento en Raleigh, Dunn y Fayetteville, NC. Contacta a Blanco's para solicitar un presupuesto gratis." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://blancosconcretepaintandmaintenance.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blanco's Concrete Paint &amp; Maintenance Service" />
    <meta property="og:title" content="Blanco's Concrete Paint &amp; Maintenance Service | Raleigh, NC" />
    <meta property="og:description" content="Servicios de pintura, concreto y mantenimiento en Raleigh, Dunn y Fayetteville, NC. Contacta a Blanco's para solicitar un presupuesto gratis." />
    <meta property="og:url" content="https://blancosconcretepaintandmaintenance.com/" />
    <meta property="og:locale" content="es_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Blanco's Concrete Paint &amp; Maintenance Service | Raleigh, NC" />
    <meta name="twitter:description" content="Servicios de pintura, concreto y mantenimiento en Raleigh, Dunn y Fayetteville, NC. Contacta a Blanco's para solicitar un presupuesto gratis." />

    <!-- =====================================================
         GOOGLE FONTS
         We are loading two fonts here directly from Google.
         No files to download -- Google delivers them for free.

         Oswald  -- used for all headings and titles
         Lato    -- used for all body text and paragraphs

         wght@400  = regular weight (normal)
         wght@600  = semi-bold (a little heavier)
         wght@700  = bold (the heaviest we use)

         display=swap means: show the fallback font first while
         these load, then swap them in. Prevents invisible text.
    ===================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- This empty div is where React loads the entire website -->
    <div id="root"></div>

    <!-- This tells the browser to run our React app -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
